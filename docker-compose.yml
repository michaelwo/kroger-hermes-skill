services:
  codex-dev:
    build: .
    image: codex-dev:3.12
    container_name: codex-dev
    environment:
      - KROGER_CLIENT_ID=${KROGER_CLIENT_ID}
      - KROGER_CLIENT_SECRET=${KROGER_CLIENT_SECRET}
    volumes:
      - ~/workspace/skills/kroger-shopping:/workspace
    stdin_open: true
    tty: true
    command: /bin/bash
