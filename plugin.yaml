name: kroger-shopping
version: "2.2.0"
description: Direct Kroger commands plus conversational read-only shopping tools for Hermes
kind: standalone
python_dependencies:
  - "requests>=2.31,<3"
  - "pypdf>=6,<7"
provides_tools:
  - kroger_search
  - kroger_recommend
  - kroger_auth_status
requires_env:
  - name: KROGER_CLIENT_ID
    description: Kroger Developer API client ID
    password: true
  - name: KROGER_CLIENT_SECRET
    description: Kroger Developer API client secret
    password: true
